name: Container smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: sync
            dockerfile: Dockerfile.sync
          - mode: mcp
            dockerfile: Dockerfile.mcp
    steps:
      - uses: actions/checkout@v5
        with:
          path: service
      - uses: docker/setup-buildx-action@v3
      - name: Build full release image including tests
        working-directory: service
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: >-
          docker buildx build --load --progress plain
          -f "$DOCKERFILE" -t local/split-smoke:ci .
      - name: Boot image and verify protocol readiness
        working-directory: service
        env:
          MODE: ${{ matrix.mode }}
        run: ./scripts/container-smoke.sh "$MODE" local/split-smoke:ci
