# Publishes the current SNAPSHOT of every module to the ai.pipestream dev
# registry on this Forgejo instance (same convention as protomolt's
# publish-registry.yml). grpc-confluence and grpc-microsoft resolve
# ai.pipestream.integration:* from that registry when they are built
# without a sibling grpc-integration checkout. Reading the registry needs
# no credentials; publishing needs the REGISTRY_PUBLISH_TOKEN repo secret.
#
# Runs on every push to main so the registry cannot drift behind the code,
# and on manual dispatch. It lives under .forgejo/ because GitHub-hosted
# runners cannot be relied on to reach git.rokkon.com.
name: Publish Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Full build and test suite
        run: ./gradlew build --no-daemon --console=plain

      - name: Publish snapshot to the dev registry
        env:
          FORGEJO_ACTOR: ${{ github.actor }}
          # The ambient token cannot publish packages on this instance even
          # with `permissions: packages: write` (kept above as defense in depth).
          FORGEJO_TOKEN: ${{ secrets.REGISTRY_PUBLISH_TOKEN }}
        run: ./gradlew publishAllPublicationsToRegistryRepository --no-daemon --console=plain
